# Prepares Horizon's game files (horizon-resources.zip) from Minecraft: Java Edition 26.3.
# Run via Actions -> Prepare game files -> Run workflow (tick "I own Minecraft: Java Edition").
name: Prepare game files

on:
  workflow_dispatch:
    inputs:
      i_own_java_edition:
        description: "I own Minecraft: Java Edition"
        type: boolean
        required: true
        default: true
      horizon_repo:
        description: "The Horizon repository to prepare with"
        default: Beam091/horizon-ios-shader
      horizon_ref:
        description: "Its branch"
        default: main

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check ownership confirmation
        env:
          OWNS: ${{ inputs.i_own_java_edition }}
        run: |
          [ "$OWNS" = true ] || { echo "Tick 'I own Minecraft: Java Edition' to run this."; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.horizon_repo }}
          ref: ${{ inputs.horizon_ref }}
          path: horizon
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon
      - name: Build horizon-prepare
        working-directory: horizon
        run: cargo build --release --locked -p horizon-prepare
      - name: Download Minecraft 26.3 from Mojang
        run: python3 horizon/packaging/ios/prepare/fetch_minecraft.py horizon "$RUNNER_TEMP/minecraft"
      - name: Prepare game files
        run: |
          mc=$RUNNER_TEMP/minecraft
          horizon/target/release/horizon-prepare --prepare --complete \
            --root horizon \
            --version-json "$mc/version.json" --client-jar "$mc/client.jar" \
            --libraries-dir "$mc/libraries" --assets-dir "$mc/assets" \
            --server-jar "$mc/server.jar" --java-home "$JAVA_HOME" \
            --output "$RUNNER_TEMP/out/resources"
      - name: Package horizon-resources.zip
        run: |
          cd "$RUNNER_TEMP/out"
          zip -qr "$RUNNER_TEMP/horizon-resources.zip" resources
          ls -lh "$RUNNER_TEMP/horizon-resources.zip"
      - name: Upload horizon-resources artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-resources
          path: ${{ runner.temp }}/horizon-resources.zip
          compression-level: 0
          if-no-files-found: error
      - name: Publish release (when repository is private)
        if: github.event.repository.private == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=files-$GITHUB_RUN_NUMBER
          gh release create "$tag" "$RUNNER_TEMP/horizon-resources.zip" --repo "$GITHUB_REPOSITORY" \
            --title "Horizon game files (run $GITHUB_RUN_NUMBER)" \
            --notes "Download horizon-resources.zip into On My iPhone > Horizon (or copy its https link and tap Download from copied link inside Horizon)."
