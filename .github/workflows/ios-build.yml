# Builds the game for iPhone and iPad on GitHub's hosted macOS runners and uploads an unsigned
# Horizon.ipa. A sideloading tool (Sideloadly, AltStore) signs it with the player's own Apple ID
# when it installs it (packaging/ios/README.md). The .ipa holds none of Mojang's files.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [ios-build]
    # Horizon Mods has its own workflow (ios-mods-app.yml).
    paths-ignore:
      - packaging/ios/builder/**
      - packaging/ios/native-mods.md
      - .github/workflows/ios-mods-*.yml
      - .github/workflows/ios-native-*.yml

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # Build with the Xcode 27 runner (macOS 27 arm64 + iOS 27 SDK) so iPadOS 27+ treats the app
    # natively (UIScene + pointer lock + Game Mode) instead of legacy iOS 18 SDK compatibility.
    runs-on: xcode-27
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-xcode27
      - name: Build
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
          # The fork whose "Native mods for iOS" issue the app's Native tab ticks.
          HORIZON_IOS_REPO: ${{ github.repository }}
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cargo build --release --locked --target aarch64-apple-ios -p horizon-client --bin horizon-client
          otool -l target/aarch64-apple-ios/release/horizon-client | grep -A4 LC_BUILD_VERSION
      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/horizon-client/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          packaging/ios/package.sh target/aarch64-apple-ios/release/horizon-client "$version" dist
      - uses: actions/upload-artifact@v7
        with:
          name: Horizon-ios
          path: dist/Horizon.ipa
          if-no-files-found: error
      # Each push to ios-build publishes a versioned release tagged `v<VERSION>-b<N>` (starting at
      # Build 1 for each new Cargo.toml version) with the unsigned `.ipa`.
      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/ios-build'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          last_build=$(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
              --jq "[.[].tagName | select(startswith(\"v${VERSION}-b\")) | ltrimstr(\"v${VERSION}-b\") | tonumber] | max // 0"
          )
          next_build=$((last_build + 1))
          tag="v${VERSION}-b${next_build}"
          asset="dist/Horizon-ios-${VERSION}-b${next_build}.ipa"
          cp dist/Horizon.ipa "$asset"
          gh release create "$tag" "$asset" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Horizon for iOS ${VERSION} (Build ${next_build})" \
            --notes-file packaging/ios/README.md
